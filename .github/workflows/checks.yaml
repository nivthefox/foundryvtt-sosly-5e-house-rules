name: 'checks'
on:
  pull_request:
  push:
    branches:
      - "main"

env:
  node_version: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Lint
        run: npm run lint:code

      - name: Unit tests
        run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}


      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Build
        run: NODE_ENV=production npm run build

  integration:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Verify browser
        run: google-chrome --version

      - name: Build module
        run: NODE_ENV=production npm run build

      - name: Verify Foundry credentials
        env:
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
          FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
        run: |
          test -n "$FOUNDRY_USERNAME" || { echo "::error::FOUNDRY_USERNAME is not configured"; exit 1; }
          test -n "$FOUNDRY_PASSWORD" || { echo "::error::FOUNDRY_PASSWORD is not configured"; exit 1; }
          test -n "$FOUNDRY_LICENSE_KEY" || { echo "::error::FOUNDRY_LICENSE_KEY is not configured"; exit 1; }

      - name: Start Foundry
        env:
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
          FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
        run: docker compose -f docker-compose.test.yml up --detach --wait foundry

      - name: Provision integration world
        run: npm run test:integration:setup

      - name: Run Playwright integration tests
        run: npm run test:integration

      - name: Show Foundry logs
        if: failure()
        continue-on-error: true
        env:
          FOUNDRY_USERNAME: unused
          FOUNDRY_PASSWORD: unused
          FOUNDRY_LICENSE_KEY: unused
        run: docker compose -f docker-compose.test.yml logs --no-color foundry

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Foundry
        if: always()
        env:
          FOUNDRY_USERNAME: unused
          FOUNDRY_PASSWORD: unused
          FOUNDRY_LICENSE_KEY: unused
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
